[tox]
env_list = lint,typecheck,py311,py312,py313,py314,docs,build
requires =
    tox>=4.11
    tox-gh>=1.3
    tox-uv>=1.16
min_version = 4.11
skip_missing_interpreters = false

[gh]
python =
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314

[testenv]
runner = uv-venv-runner
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.2
    pytest-cov>=5.0
commands = pytest {posargs:tests}

[testenv:cov]
runner = uv-venv-runner
deps = {[testenv]deps}
commands =
    pytest --cov --cov-report=term-missing --cov-report=xml {posargs:tests}

[testenv:lint]
runner = uv-venv-runner
package = skip
deps = ruff>=0.6
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:fmt]
runner = uv-venv-runner
package = skip
deps = ruff>=0.6
commands =
    ruff format src tests
    ruff check --fix src tests

[testenv:typecheck]
runner = uv-venv-runner
deps =
    mypy>=1.10
    pytest>=8.2
commands = mypy src

[testenv:docs]
runner = uv-venv-runner
extras = docs
commands =
    sphinx-build -W --keep-going -b html docs/source docs/build/html

[testenv:build]
runner = uv-venv-runner
package = skip
deps =
    build>=1.2
    twine>=5.1
commands =
    python -m build
    twine check dist/*
