name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uvx --from tox --with tox-uv tox -e lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uvx --from tox --with tox-uv tox -e typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uvx --from tox --with tox-uv tox -e py$(echo ${{ matrix.python }} | tr -d .)

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uvx --from tox --with tox-uv tox -e docs

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uvx --from tox --with tox-uv tox -e build

  # One context for branch protection to require, rather than eight named jobs.
  # A matrix job renamed or a Python version added would otherwise silently
  # stop being enforced, and an automated release PR — which does not run these
  # — could never satisfy them at all.
  gate:
    name: CI / gate
    if: always()
    needs: [lint, typecheck, test, docs, build]
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      SKIP_AUTOMATED_PR_VALIDATION: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
      LINT_RESULT: ${{ needs.lint.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      TEST_RESULT: ${{ needs.test.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Enforce all CI results
        shell: bash
        run: |
          if [[ "$SKIP_AUTOMATED_PR_VALIDATION" == "true" ]]; then
            echo "Release PR: validation jobs intentionally skipped."
            exit 0
          fi
          required=(
            "$LINT_RESULT"
            "$TYPECHECK_RESULT"
            "$TEST_RESULT"
            "$DOCS_RESULT"
            "$BUILD_RESULT"
          )
          for result in "${required[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
