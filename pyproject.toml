[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humble-steam-key-redeemer"
dynamic = ["version"]
description = "Redeem Humble Bundle keys on Steam, skipping games you already own."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jon Bogaty", email = "jon@jonbogaty.com" }]
keywords = ["humble-bundle", "steam", "keys", "redeem", "automation", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    # Humble has no public API, so its half is driven through a real browser.
    # Playwright bundles its own browser and driver, so there is no separate
    # webdriver to install and no urllib3 pin to collide with.
    "playwright>=1.45",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    # Steam authentication, ownership, and redemption live in vendor-fabric's
    # Steam connector rather than being reimplemented here.
    "vendor-fabric[steam]>=2.5",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.3",
    "furo>=2024.5.6",
    "myst-parser[linkify]>=3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6",
    "sphinxext-opengraph>=0.9",
    "sphinx-autodoc-typehints>=2.1",
]

[project.scripts]
hskr = "humble_steam_key_redeemer.cli:main"
humble-steam-key-redeemer = "humble_steam_key_redeemer.cli:main"

[project.urls]
Homepage = "https://github.com/jbcom/humble-steam-key-redeemer"
Documentation = "https://jbcom.github.io/humble-steam-key-redeemer/"
Repository = "https://github.com/jbcom/humble-steam-key-redeemer"
Issues = "https://github.com/jbcom/humble-steam-key-redeemer/issues"

# ---------------------------------------------------------------- hatch build

[tool.hatch.version]
path = "src/humble_steam_key_redeemer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/humble_steam_key_redeemer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md"]

# ------------------------------------------------------------ hatch envs

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov --cov-report=term-missing --cov-report=xml {args:tests}"
lint = ["ruff check {args:.}", "ruff format --check {args:.}"]
fmt = ["ruff format {args:.}", "ruff check --fix {args:.}"]
typecheck = "mypy {args:src}"
all = ["lint", "typecheck", "cov"]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.docs]
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W --keep-going -b html docs/source docs/build/html"
serve = "python -m http.server -d docs/build/html {args:8000}"
clean = "python -c \"import shutil; shutil.rmtree('docs/build', ignore_errors=True)\""

# ---------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations
    "S",         # flake8-bandit
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez
    "T20",       # flake8-print
    "PT",        # pytest-style
    "RET",       # flake8-return
    "SIM",       # flake8-simplify
    "PTH",       # use pathlib
    "PL",        # pylint
    "TRY",       # tryceratops
    "RUF",       # ruff-specific
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # Any is occasionally correct for JSON payloads
    "TRY003",  # long messages outside exception class are fine here
    "PLR0913", # some CLI entrypoints legitimately take many options
    "PLR0917", # likewise: a Typer command's options are its signature
]

[tool.ruff.lint.per-file-ignores]
# Test names and class names document themselves; assertions are the point.
"tests/*" = ["S", "D", "ANN", "PLR2004", "SLF001", "E501"]
"docs/source/conf.py" = ["D100", "A001", "INP001"]
# The CLI layer is the one place printing to the console is the point.
"src/humble_steam_key_redeemer/cli/*" = ["T20"]
"src/humble_steam_key_redeemer/core/console.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["humble_steam_key_redeemer"]

# ---------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

# -------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: tests that require live network access (deselect with '-m \"not network\"')",
]

[tool.coverage.run]
source = ["src/humble_steam_key_redeemer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
